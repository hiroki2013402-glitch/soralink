name: Upload ZIP Contents

on:
  workflow_dispatch:
  push:
    paths:
      - "upload/**"
    branches:
      - main

permissions:
  contents: write

jobs:
  extract-and-commit:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: main

      - name: Find ZIP file
        id: zip
        shell: bash
        run: |
          set -euo pipefail

          mapfile -t ZIP_FILES < <(find upload -maxdepth 1 -type f -iname '*.zip' | sort)

          if [ "${#ZIP_FILES[@]}" -ne 1 ]; then
            echo "uploadフォルダーにはZIPファイルを1つだけ配置してください。"
            exit 1
          fi

          echo "file=${ZIP_FILES[0]}" >> "$GITHUB_OUTPUT"

      - name: Extract ZIP and remove top-level folder
        shell: bash
        env:
          ZIP_FILE: ${{ steps.zip.outputs.file }}
        run: |
          set -euo pipefail

          mkdir -p /tmp/zip-source /tmp/zip-final

          python3 - "$ZIP_FILE" <<'PY'
          import sys
          import zipfile
          from pathlib import PurePosixPath

          zip_path = sys.argv[1]

          with zipfile.ZipFile(zip_path) as z:
              for info in z.infolist():
                  name = info.filename.replace("\\", "/")
                  path = PurePosixPath(name)

                  if path.is_absolute() or ".." in path.parts:
                      raise SystemExit(f"危険なZIPパスを検出しました: {name}")

                  if path.parts and ":" in path.parts[0]:
                      raise SystemExit(f"不正なZIPパスを検出しました: {name}")

              z.extractall("/tmp/zip-source")
          PY

          python3 <<'PY'
          from pathlib import Path
          import shutil

          source = Path("/tmp/zip-source")
          destination = Path("/tmp/zip-final")

          items = list(source.iterdir())

          # ZIP内にトップレベルのフォルダーが1つだけある場合、
          # そのフォルダーの中身を取り出す。
          if len(items) == 1 and items[0].is_dir():
              root = items[0]
          else:
              root = source

          for item in root.iterdir():
              target = destination / item.name

              if item.is_dir():
                  shutil.copytree(item, target)
              else:
                  shutil.copy2(item, target)

          print("ZIPの最上位フォルダーを処理しました。")
          PY

      - name: Sync files to repository root
        shell: bash
        run: |
          set -euo pipefail

          rsync -a --delete \
            --exclude='.git/' \
            --exclude='.github/' \
            --exclude='upload/' \
            /tmp/zip-final/ ./

      - name: Commit and push
        shell: bash
        run: |
          set -euo pipefail

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          git add -A -- . \
            ':(exclude)upload/**' \
            ':(exclude).github/**'

          if git diff --cached --quiet; then
            echo "コミットする変更はありません。"
            exit 0
          fi

          git commit -m "Update files from uploaded ZIP"
          git push origin HEAD:main
